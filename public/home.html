<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主頁面</title>

  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
 
  <!-- 全域樣式 -->
  <link rel="stylesheet" href="/assets/css/app.css?v=BUILD_ID">
  <link rel="stylesheet" href="/assets/css/pages/projects.css?v=BUILD_ID">
  <link rel="stylesheet" href="/assets/css/pages/reminders.css?v=BUILD_ID">
  <link rel="stylesheet" href="/assets/css/pages/password.css?v=BUILD_ID">

  <link rel="stylesheet" href="/assets/css/pages/home.css?v=BUILD_ID">

  
</head>
<body>
  
  <div class="app">
    <!-- 左側 Sidebar：帳號、登出、選單 -->
    <aside class="sidebar">
      <div class="logo-box">
        <img src="/assets/img/logo-invert.png" alt="logo" />
      </div>
      <div class="account">
        <div>
          <div class="name" id="accountName">使用者名稱</div>
          <div class="role" id="accountRole">已登入</div>
        </div>
        <button id="logoutBtn" class="logout-btn">登出</button>
      </div>
      <ul class="nav">
        <li><button class="active" data-view="projects">專案進度</button></li>
        <li><button data-view="reminders">事務提醒</button></li>
        <li><button data-view="password">修改密碼</button></li>
      </ul>
    </aside>

    <!-- 右側 Main -->
    <main class="main">
      <!-- 頁面頂端標題列 -->
      <div class="topbar">
        <div class="title" id="pageTitle">所有專案進度</div>
      </div>

      <section class="content">
        <!-- 專案進度 View -->
        <div id="view-projects" class="view">
          <div class="card">

            <!-- 頁簽：進行中／已完成／全部 -->
            <div class="tabs-row" role="tablist" aria-label="專案篩選">
              <button class="tab" role="tab" data-filter="ongoing" aria-selected="true">進行中</button>
              <button class="tab" role="tab" data-filter="done" aria-selected="false">已完成</button>
              <button class="tab" role="tab" data-filter="all" aria-selected="false">全部</button>
            </div>

            <!-- 工具列：左狀態說明 + 右功能按鈕 -->
            <div class="card-topbar">

              <div class="legend" id="legendBar">
                <span class="pill"><i class="dot ok"></i>正常</span>
                <span class="pill"><i class="dot warn"></i>輕微超時</span>
                <span class="pill"><i class="dot danger"></i>超時7天</span>
                <span class="pill"><i class="dot done"></i>完成(上傳照片)</span>
              </div>
              <div class="function-buttons">
                <div id="unsavedNotice">
                  ⚠️ 尚未儲存修改，請記得按下「儲存」
                </div>
                <div>
                  <button id="addProjectBtn">
                    新增
                  </button>
                  <button id="saveBtn">
                    儲存
                  </button>
                </div>
              </div>
            </div>

            <!-- Grid 表頭 -->
            <div class="grid-header mode-default" id="gridHeader">
              <div>階段</div>
              <div>編號</div>
              <div>案名</div>

              <div class="task-head"></div>
              <div class="task-head"></div>
              <div class="task-head"></div>
              <div class="task-head"></div>
              <div class="task-head"></div>
              <div class="task-head"></div>
              <div class="task-head"></div>
              <div class="task-head"></div>
              
              <div class="action-head"></div>
              <div class="action-head"></div>
              <div class="action-head"></div>
            </div>

            <!-- 由程式動態注入 -->
            <div id="projectsGrid"></div>
          </div>
        </div>

        <!-- 事務提醒 -->
        <div id="view-reminders" class="view" style="display:none">
          <div class="card">

            <!-- 跟專案頁一致的工具列（空左 + 新增按鈕在右） -->
            <div class="card-topbar">
              <div></div> <!-- 專案頁是 legend，這裡先空著 -->
              <div class="function-buttons">
                <div>
                  <button id="addAffairBtn">新增</button>
                </div>
              </div>
            </div>

            <div id="remindersGrid" class="person-grid" aria-live="polite">載入中…</div>
          </div>
        </div>

        <!-- 修改密碼 View（保持原樣） -->
        <div id="view-password" class="view" style="display:none">
          <div class="card">
            <h2>修改密碼</h2>
            <p>請輸入舊密碼與新密碼。</p>
            <form id="pwdForm" onsubmit="return false;">
              <div>
                <label>
                  <div>舊密碼</div>
                  <input type="password" id="oldPwd" placeholder="輸入舊密碼" required>
                </label>
                <label>
                  <div>新密碼</div>
                  <input type="password" id="newPwd" placeholder="至少 6 碼" required minlength="6">
                </label>
                <label>
                  <div>再次輸入新密碼</div>
                  <input type="password" id="newPwd2" placeholder="再次輸入新密碼" required minlength="6">
                </label>
                <button id="savePwd">儲存</button>
                <div id="pwdMsg"></div>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- 新增/編輯 共用 Modal  -->
      <div id="createModal" class="modal-overlay">
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title">新增專案</h3>
            <button id="modalCloseBtn" class="modal-close" aria-label="關閉">&times;</button>
          </div>
          <div class="modal-body">
            <label>編號（必填）
              <input id="f_project_id" />
            </label>
            <label>案名（必填）
              <input id="f_name" />
            </label>
            <label>階段
              <select id="f_stage">
                <option value="0">等待</option>
                <option value="1">設計</option>
                <option value="2">施工</option>
              </select>
            </label>
            <label>開始日
              <input id="f_start_date" type="date" />
            </label>
            <label>工期天數
              <input id="f_estimated_days" type="number" min="0" step="1" />
            </label>
            <label>負責人
              <select id="f_responsible_user">
                <option value="">（未指派）</option>
              </select>
            </label>

            <div id="f_due_preview">預計完工日：—</div>

            <div class="modal-actions">
              <button id="f_cancel">取消</button>
              <button id="f_submit">送出</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 新增事務 Modal -->
      <div id="affairModal" class="modal-overlay" style="display:none;">
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title">新增事務</h3>
            <button id="affairCloseBtn" class="modal-close" aria-label="關閉">&times;</button>
          </div>
          <div class="modal-body">
            <label>案名（可留空）
              <input id="af_title" />
            </label>
            <label class="form-col-2">內容（必填）
              <textarea id="af_content" rows="4" placeholder="請輸入事務內容"></textarea>
            </label>
            <label>指派對象（必選）
              <select id="af_assignee"></select>
            </label>
            <label>期限天數（必填，正整數）
              <input id="af_due" type="number" min="1" step="1" />
            </label>

            <div class="modal-actions">
              <button id="af_cancel">取消</button>
              <button id="af_submit">建立</button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>



  <!-- 上傳照片 Modal 與邏輯 -->
  <input id="uploadInput" type="file" accept="image/*" multiple style="display:none" />

  <div id="uploadModal">
    <div>
      <h3>上傳照片</h3>
      <p id="uploadHint"></p>
      <div>
        <button id="chooseFileBtn">選擇檔案</button>
        <button id="cancelUploadBtn">取消</button>
      </div>
      <div id="uploadStatus"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="/assets/js/pages/home.js?v=BUILD_ID"></script>
  <script type="module" src="/assets/js/pages/reminders.js?v=BUILD_ID"></script>

  <!-- 動態變更標題 -->
  <script>
    (function () {
      const TITLE_MAP = {
        "/": "首頁｜Designer",
        "/projects" : "專案管理",
        "/reminders": "事務提醒",
        "/password" : "修改密碼"
      };

      function applyTitle() {
        document.title = TITLE_MAP[location.pathname] || "Designer";
      }

      applyTitle();
      window.addEventListener("popstate", applyTitle);

      const _pushState = history.pushState;
      history.pushState = function () {
        _pushState.apply(history, arguments);
        applyTitle();
      };

      const _replaceState = history.replaceState;
      history.replaceState = function () {
        _replaceState.apply(history, arguments);
        applyTitle();
      };
    })();
  </script>


  <!-- 右下角版本徽章（不佔版面高度） -->
  <div id="buildBadge" aria-hidden="true">
    <span class="mono" id="buildVersion">version: —</span>
  </div>

  <!-- 開發版（本機或無環境變數時的友善顯示） -->
  <script type="module">
  (async () => {
    const badge = document.getElementById("buildBadge");
    const text  = document.getElementById("buildVersion");
    if (!badge || !text) return;

    let loaded = false;
    let visible = false;

    const isLocal =
      location.hostname === "localhost" ||
      location.hostname === "127.0.0.1";

    // ① 嘗試取得正式版本（正式環境）
    if (!isLocal) {
      try {
        const res = await fetch("/version");
        if (!res.ok) throw new Error("fetch failed");
        const v = await res.json();

        if (v?.version) {
          text.textContent = `version: ${v.version}`;
          loaded = true;
        } else {
          text.textContent = "version: unknown";
        }
      } catch (e) {
        text.textContent = "version: unavailable";
      }
    }

    // ② 本機 fallback（只在 localhost）
    if (isLocal) {
      text.textContent = "version: LOCAL-DEV";
      loaded = true; // ⭐ 允許快捷鍵顯示
    }

    // ③ Alt + Shift + V 切換顯示
    document.addEventListener("keydown", (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;

      if (e.altKey && e.shiftKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        if (!loaded) return;

        visible = !visible;
        badge.style.display = visible ? "flex" : "none";
        badge.setAttribute("aria-hidden", String(!visible));
      }
    });
  })();
  </script>


</body>
</html>
